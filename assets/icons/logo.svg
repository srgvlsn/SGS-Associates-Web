<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sgsGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E67A" />
      <stop offset="100%" stop-color="#00B85C" />
    </linearGradient>
    <linearGradient id="sgsPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9152FF" />
      <stop offset="100%" stop-color="#6F2FE0" />
    </linearGradient>
  </defs>

  <!-- Stylized Modern 'S' Emblem -->
  <g transform="translate(10, 8)">
    <!-- Top Green Fin -->
    <path d="M 12 10 
             C 12 4, 18 0, 26 0 
             L 64 0 
             C 74 0, 82 8, 82 18 
             L 82 46 
             C 82 54, 76 60, 68 58 
             C 48 54, 32 38, 12 36 
             C 12 28, 12 16, 12 10 Z" 
          fill="url(#sgsGreenGrad)" />

    <!-- Bottom Purple Fin -->
    <path d="M 10 38 
             C 18 38, 38 52, 58 56 
             C 66 58, 70 66, 70 74 
             L 70 82 
             C 70 90, 62 96, 52 96 
             L 18 96 
             C 8 96, 0 88, 0 78 
             L 0 48 
             C 0 42, 4 38, 10 38 Z" 
          fill="url(#sgsPurpleGrad)" />
  </g>

  <!-- Typography: SGS -->
  <text x="110" y="68" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1" fill="#FFFFFF">SGS</text>

  <!-- Typography: ASSOCIATES -->
  <text x="112" y="86" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12.5" letter-spacing="7" fill="#E2E8F0">ASSOCIATES</text>

  <!-- Sub-caption: ACCOUNTANTS AND TAX PRACTITIONERS -->
  <text x="112" y="101" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="8" letter-spacing="1.8" fill="#94A3B8">ACCOUNTANTS AND TAX PRACTITIONERS</text>
</svg>
